<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ভোটার তালিকা সার্চ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#0f1720; --card:#17222e; --card2:#1e2b3a; --text:#eef3f8; --muted:#93a3b5;
    --accent:#2fb67c; --accent2:#1f8f5f; --border:#2a3a4a; --chip:#24344370;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f7f6; --card:#ffffff; --card2:#f0f4f3; --text:#17222e; --muted:#5a6b7a;
      --accent:#1f8f5f; --accent2:#176f49; --border:#dde5e2; --chip:#e7f3ee;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --card:#17222e; --card2:#1e2b3a; --text:#eef3f8; --muted:#93a3b5;
    --accent:#2fb67c; --accent2:#1f8f5f; --border:#2a3a4a; --chip:#24344370;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; font-family:'Noto Sans Bengali','Segoe UI',sans-serif;
    background:var(--bg); color:var(--text); min-height:100%;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:18px 16px 14px; position:sticky; top:0;
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    background:linear-gradient(180deg,var(--bg) 70%,transparent); z-index:5;
  }
  h1{font-size:19px; margin:0 0 4px; font-weight:700;}
  .sub{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .tabs{display:flex; gap:8px; margin-bottom:10px;}
  .tab{
    flex:1; text-align:center; padding:9px 6px; border-radius:10px; font-size:13.5px;
    background:var(--card2); color:var(--muted); border:1px solid var(--border); cursor:pointer; user-select:none;
  }
  .tab.active{background:var(--accent); color:#06140d; border-color:var(--accent); font-weight:700;}
  .searchbox{
    display:flex; gap:8px; align-items:center; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:4px 4px 4px 14px;
  }
  .searchbox input{
    flex:1; background:transparent; border:0; outline:0; color:var(--text); font-size:16px;
    padding:12px 0; font-family:inherit;
  }
  .searchbox input::placeholder{color:var(--muted);}
  .clearbtn{background:var(--card2); border:0; color:var(--muted); width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer;}
  main{padding:4px 16px 40px;}
  .count{color:var(--muted); font-size:12.5px; margin:12px 2px 8px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 15px; margin-bottom:10px;
  }
  .card .name{font-size:16.5px; font-weight:700; margin-bottom:6px;}
  .card .name mark, .card .rowval mark{background:var(--accent); color:#06140d; border-radius:3px; padding:0 2px;}
  .meta{display:flex; flex-wrap:wrap; gap:6px 10px; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .meta b{color:var(--text); font-weight:600;}
  .addr{font-size:13px; color:var(--muted); line-height:1.5;}
  .chip{display:inline-block; background:var(--chip); border:1px solid var(--border); border-radius:999px; padding:2px 9px; font-size:11.5px; color:var(--muted);}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}
  .empty .big{font-size:40px; margin-bottom:10px;}
  footer{text-align:center; color:var(--muted); font-size:11.5px; padding:10px 20px 30px;}
</style>
</head>
<body>
<header>
  <h1>🗳️ ভোটার তালিকা সার্চ</h1>
  <p class="sub" id="totalLine">লোড হচ্ছে...</p>
  <div class="tabs">
    <div class="tab active" data-mode="n">নাম</div>
    <div class="tab" data-mode="f">পিতার নাম</div>
    <div class="tab" data-mode="m">মাতার নাম</div>
  </div>
  <div class="searchbox">
    <input id="q" type="text" placeholder="নাম লিখে সার্চ করুন..." autocomplete="off">
    <button class="clearbtn" id="clearBtn" title="মুছুন">✕</button>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="results"></div>
</main>
<footer>সম্পূর্ণ অফলাইন — কোনো ইন্টারনেট প্রয়োজন নেই</footer>

<script src="data.js"></script>
<script>
let mode = 'n';
const q = document.getElementById('q');
const results = document.getElementById('results');
const count = document.getElementById('count');
const totalLine = document.getElementById('totalLine');
const tabs = document.querySelectorAll('.tab');

totalLine.textContent = `মোট ${VOTERS.length.toLocaleString('bn')} জন ভোটারের তথ্য লোড হয়েছে`;

tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  mode = t.dataset.mode;
  const ph = {n:'নাম', f:'পিতার নাম', m:'মাতার নাম'}[mode];
  q.placeholder = ph + ' লিখে সার্চ করুন...';
  render();
}));

document.getElementById('clearBtn').addEventListener('click', () => { q.value=''; render(); q.focus(); });

function escapeHtml(s){
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function highlight(text, term){
  if(!term) return escapeHtml(text);
  const idx = text.indexOf(term);
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+term.length)) + '</mark>' + escapeHtml(text.slice(idx+term.length));
}

let debounceTimer;
q.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 80);
});

function render(){
  const term = q.value.trim();
  if(!term){
    results.innerHTML = '';
    count.textContent = '';
    results.innerHTML = `<div class="empty"><div class="big">🔎</div>খুঁজতে উপরে লিখুন</div>`;
    return;
  }
  const field = mode;
  const matches = [];
  for(let i=0;i<VOTERS.length;i++){
    const v = VOTERS[i];
    if(v[field] && v[field].indexOf(term) !== -1){
      matches.push(v);
      if(matches.length >= 200) break;
    }
  }
  count.textContent = matches.length >= 200
    ? 'প্রথম ২০০টি ফলাফল দেখানো হচ্ছে (আরও নির্দিষ্ট করে লিখুন)'
    : `${matches.length.toLocaleString('bn')}টি ফলাফল পাওয়া গেছে`;

  if(matches.length === 0){
    results.innerHTML = `<div class="empty"><div class="big">😕</div>কোনো ফলাফল পাওয়া যায়নি</div>`;
    return;
  }

  results.innerHTML = matches.map(v => `
    <div class="card">
      <div class="name">${highlight(v.n, field==='n'?term:'')}</div>
      <div class="meta">
        <span><b>ক্রমিক:</b> ${v.s}</span>
        <span><b>ভোটার নং:</b> ${v.v}</span>
        ${v.w ? `<span class="chip">ওয়ার্ড ${v.w}</span>` : ''}
        ${v.g ? `<span class="chip">${v.g==='M'?'পুরুষ':v.g==='F'?'মহিলা':''}</span>` : ''}
      </div>
      <div class="meta">
        <span><b>পিতা:</b> ${highlight(v.f, field==='f'?term:'')}</span>
      </div>
      <div class="meta">
        <span><b>মাতা:</b> ${highlight(v.m, field==='m'?term:'')}</span>
      </div>
      <div class="addr">📍 ${escapeHtml(v.a)}</div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
